name: Build and Test
on: push

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin

      # Cache Maven
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build classique
      - name: Run Build & Tests
        run: mvn -B clean test

      # Mutation Testing
      - name: Run PIT Mutation Testing
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      # Extraction du score
      - name: Extract mutation score
        run: |
          REPORT_DIR=$(find target/pit-reports -maxdepth 1 -type d | tail -1)
          SCORE=$(grep -oP 'Mutation Coverage.*?\K[0-9]+' $REPORT_DIR/index.html | 
head -1)
          echo "mutation_score=$SCORE" >> $GITHUB_ENV
          echo "Mutation score detected: $SCORE"

      # Comparaison avec baseline
      - name: Compare score with baseline
        run: |
          BASELINE=$(cat mutation_baseline.txt)
          echo "Baseline: $BASELINE"
          echo "Current: ${{ env.mutation_score }}"

          if [ ${{ env.mutation_score }} -lt $BASELINE ]; then
            echo " Mutation score decreased!"
            exit 1
          fi

          echo " Mutation score OK"

      # Rickroll si build FAILED
      - name: Rickroll on failure
        if: failure()
        uses: docker://ghcr.io/kerwanp/random-rickroll:latest

