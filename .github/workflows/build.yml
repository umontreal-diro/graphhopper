name: Build and Test
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ 24, 25-ea ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
      - name: Cache Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Cache node
        uses: actions/cache@v4
        with:
          path: web-bundle/node
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os}}-node-
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: web-bundle/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/pom.xml', '**/package.json') }}
          restore-keys: |
            ${{ runner.os}}-node_modules-
      - name: Build ${{ matrix.java-version }}
        run: mvn -B clean test

      - name: Run PIT Mutation Tests
        run: |
          mvn org.pitest:pitest-maven:mutationCoverage -DwithHistory
          SCORE=$(grep -oP '(?<=<mutationScore>).*(?=</mutationScore>)' target/pit-reports/mutations.xml || echo "0")
          echo "$SCORE" > mutation_score.txt
          echo "CURRENT_SCORE=$SCORE" >> $GITHUB_ENV

          - name: Upload mutation score artifact
            if: github.ref == 'refs/heads/main'
            uses: actions/upload-artifact@v4
            with:
              name: baseline-mutation-score
              path: mutation_score.txt

          - name: Download baseline mutation score
            if: github.ref != 'refs/heads/main'
            uses: actions/download-artifact@v4
            with:
              name: baseline-mutation-score
              path: baseline

          - name: Compare mutation scores
            if: github.ref != 'refs/heads/main'
            run: |
              BASE_SCORE=$(cat baseline/mutation_score.txt || echo "0")
              echo "Baseline: $BASE_SCORE"
              echo "Current: $CURRENT_SCORE"
              if (( $(echo "$CURRENT_SCORE < $BASE_SCORE" | bc -l) )); then
                echo "❌ Mutation score decreased! ($CURRENT_SCORE < $BASE_SCORE)"
                exit 1
              else
                echo "✅ Mutation score maintained or improved."
              fi

